services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env

  frontend:
    image: node:20-slim
    working_dir: /app
    # Vite proxies /api to the backend service; VITE_API_HOST overrides localhost.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_HOST=backend
    ports:
      - "5173:5173"
    volumes:
      - ./emora-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
